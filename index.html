<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VR ER Triage Simulator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <script>
    /* =====================================================================
       AUDIO ENGINE (user's real ICU recording: 0.10-2.00s normal loop,
       3.30-8.25s critical loop, playbackRate rises with HR)
       ===================================================================== */
    const AudioEngine = {
      ctx: null, flatlineOsc: null,
      monitorBuf: null, monitorSrc: null, monitorGain: null, monitorMode: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      async loadMonitor(url) {
        const res = await fetch(url);
        const ab = await res.arrayBuffer();
        this.monitorBuf = await this.ctx.decodeAudioData(ab);
      },
      startMonitorLoop(mode) {
        if (!this.monitorBuf) return;
        this.stopMonitor();
        const s = this.ctx.createBufferSource();
        s.buffer = this.monitorBuf; s.loop = true;
        if (mode === 'normal') { s.loopStart = 0.10; s.loopEnd = 2.00; }
        else                   { s.loopStart = 3.30; s.loopEnd = 8.25; }
        const g = this.ctx.createGain(); g.gain.value = 0.55;
        s.connect(g); g.connect(this.ctx.destination);
        s.start(0, s.loopStart);
        this.monitorSrc = s; this.monitorGain = g; this.monitorMode = mode;
      },
      setMonitorState(critical, rate) {
        if (!this.monitorBuf || !this.ctx) return;
        const mode = critical ? 'critical' : 'normal';
        if (mode !== this.monitorMode) this.startMonitorLoop(mode);
        if (this.monitorSrc) this.monitorSrc.playbackRate.value = rate;
      },
      stopMonitor() {
        if (this.monitorSrc) { try { this.monitorSrc.stop(); } catch (e) {} this.monitorSrc = null; }
        this.monitorMode = null;
      },
      beep(freq, dur, vol) {
        if (!this.ctx) return;
        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(vol, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + dur);
      },
      good() { this.beep(620, 0.1, 0.08); setTimeout(() => this.beep(930, 0.12, 0.08), 110); },
      bad()  { this.beep(220, 0.25, 0.10); },
      flatlineStart() {
        if (!this.ctx || this.flatlineOsc) return;
        this.stopMonitor();
        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
        o.type = 'sine'; o.frequency.value = 640; g.gain.value = 0.05;
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); this.flatlineOsc = o;
        this.flatlineTimer = setTimeout(() => this.flatlineStop(), 30000);  // auto-stop after 30s
      },
      flatlineStop() {
        if (this.flatlineTimer) { clearTimeout(this.flatlineTimer); this.flatlineTimer = null; }
        if (this.flatlineOsc) { try { this.flatlineOsc.stop(); } catch (e) {} this.flatlineOsc = null; }
      },
      hiss(dur = 1.4) {
        if (!this.ctx) return;
        const len = this.ctx.sampleRate * dur;
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = this.ctx.createBufferSource(); const g = this.ctx.createGain();
        g.gain.value = 0.3; src.buffer = buf;
        src.connect(g); g.connect(this.ctx.destination); src.start();
      }
    };

    /* =====================================================================
       GAME STATE + DEBRIEF LOG
       ===================================================================== */
    const GAME = {
      phase: 'WELCOME',
      observeTime: 20,
      score: 0, decisionsCorrect: 0, decisionsTotal: 0,
      startTime: null,
      decomp: { stage: null, site: null },
      patients: {
        patientA: { label: 'Ravi',  triage: 'red',    stage: 'triage', saved: false, dead: false },
        patientB: { label: 'Meena', triage: 'yellow', stage: 'triage', saved: false, dead: false },
        patientC: { label: 'Arjun', triage: 'green',  stage: 'triage', saved: false, dead: false }
      }
    };

    const DEBRIEF = [];   // {topic, ok, why}
    function logDebrief(topic, ok, why) { DEBRIEF.push({ topic, ok, why }); }

    function addScore(points, correct) {
      GAME.score += points;
      GAME.decisionsTotal += 1;
      if (correct) { GAME.decisionsCorrect += 1; AudioEngine.good(); }
      else AudioEngine.bad();
      updateHUD();
    }

    function setMessage(msg) {
      const t = document.querySelector('#hud-msg');
      if (t) t.setAttribute('value', msg);
      const border = document.querySelector('#hud-border');
      if (border) {
        border.setAttribute('color', '#7fe9ff');
        setTimeout(() => border.setAttribute('color', '#2a6f85'), 350);
      }
    }
    function updateHUD() {
      const s = document.querySelector('#hud-score');
      if (s) s.setAttribute('value', 'SCORE ' + GAME.score + '    |    ' + GAME.phase);
    }

    /* =====================================================================
       UI PANEL BUILDER
       ===================================================================== */
    function clearPanel(id) {
      const old = document.querySelector('#' + id);
      if (old) old.parentNode.removeChild(old);
    }

    /* Fisher-Yates: randomize option order inside a panel so the correct
       answer is never predictably at the top. Order of STAGES is unchanged. */
    function shuffled(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function makePanel(id, title, pos, buttons, width, closable) {
      clearPanel(id);
      if (closable === undefined) closable = true;
      const W = width || 1.7;
      const rowH = 0.19;
      const titleLines = title.split('\n').length;
      const titleH = 0.10 + titleLines * 0.075;
      const H = titleH + buttons.length * rowH + 0.12;

      /* pos === 'hud' -> panel rides the camera and appears just above the
         HUD, so it is always in view wherever the doctor is standing.
         Used for the room-level panels (welcome, results, debrief).      */
      const hudMode = (pos === 'hud');
      const parent = hudMode
        ? document.querySelector('#hud-anchor')
        : document.querySelector('a-scene');

      const panel = document.createElement('a-entity');
      panel.setAttribute('id', id);
      if (hudMode) {
        // scale the world-sized panel down to comfortable near-field size
        const s = 0.30;
        panel.setAttribute('scale', s + ' ' + s + ' ' + s);
        panel.setAttribute('position', '0 ' + (0.16 + (H * s) / 2) + ' 0');
      } else {
        panel.setAttribute('position', pos);
      }

      const border = document.createElement('a-plane');
      border.setAttribute('width', W + 0.04); border.setAttribute('height', H + 0.04);
      border.setAttribute('color', '#2a6f85'); border.setAttribute('opacity', '0.9');
      border.setAttribute('position', '0 0 -0.002');
      panel.appendChild(border);

      const bg = document.createElement('a-plane');
      bg.setAttribute('width', W); bg.setAttribute('height', H);
      bg.setAttribute('color', '#0b1c22'); bg.setAttribute('opacity', '0.95');
      panel.appendChild(bg);

      const titleEl = document.createElement('a-text');
      titleEl.setAttribute('value', title);
      titleEl.setAttribute('align', 'center');
      titleEl.setAttribute('color', '#bfeeff');
      titleEl.setAttribute('width', W * 0.95);
      titleEl.setAttribute('wrap-count', Math.round(W * 34));
      titleEl.setAttribute('position', '0 ' + (H / 2 - titleH / 2 - 0.02) + ' 0.01');
      panel.appendChild(titleEl);

      buttons.forEach((b, i) => {
        const y = H / 2 - titleH - 0.10 - i * rowH;
        const btn = document.createElement('a-plane');
        btn.setAttribute('class', 'clickable');
        btn.setAttribute('width', W - 0.16);
        btn.setAttribute('height', rowH - 0.045);
        btn.setAttribute('position', '0 ' + y + ' 0.01');
        btn.setAttribute('color', b.color || '#2a5563');
        btn.dataset.basecolor = b.color || '#2a5563';
        btn.dataset.selected = 'false';

        const label = document.createElement('a-text');
        label.setAttribute('value', b.label);
        label.setAttribute('align', 'center');
        label.setAttribute('color', '#ffffff');
        label.setAttribute('width', (W - 0.2) * 1.05);
        label.setAttribute('wrap-count', Math.round(W * 30));
        label.setAttribute('position', '0 0 0.01');
        btn.appendChild(label);

        btn.addEventListener('mouseenter', () => {
          if (btn.dataset.selected === 'false') btn.setAttribute('color', '#3f7d92');
        });
        btn.addEventListener('mouseleave', () => {
          if (btn.dataset.selected === 'false') btn.setAttribute('color', btn.dataset.basecolor);
        });
        btn.addEventListener('click', () => b.onClick(btn));
        panel.appendChild(btn);
      });

      if (closable) {
        const closeBtn = document.createElement('a-plane');
        closeBtn.setAttribute('class', 'clickable');
        closeBtn.setAttribute('width', 0.14);
        closeBtn.setAttribute('height', 0.14);
        closeBtn.setAttribute('position', (W / 2 - 0.12) + ' ' + (H / 2 - 0.12) + ' 0.015');
        closeBtn.setAttribute('color', '#8a2a2a');
        const xText = document.createElement('a-text');
        xText.setAttribute('value', 'X');
        xText.setAttribute('align', 'center');
        xText.setAttribute('color', '#ffffff');
        xText.setAttribute('width', 1.4);
        xText.setAttribute('position', '0 0 0.01');
        closeBtn.appendChild(xText);
        closeBtn.addEventListener('mouseenter', () => closeBtn.setAttribute('color', '#c93f3f'));
        closeBtn.addEventListener('mouseleave', () => closeBtn.setAttribute('color', '#8a2a2a'));
        closeBtn.addEventListener('click', () => clearPanel(id));
        panel.appendChild(closeBtn);
      }

      parent.appendChild(panel);
      refreshRaycasters();
      return panel;
    }

    function refreshRaycasters() {
      setTimeout(() => {
        document.querySelectorAll('[raycaster]').forEach(r => {
          if (r.components.raycaster) r.components.raycaster.refreshObjects();
        });
      }, 100);
    }

    /* =====================================================================
       PHASE 0 — WELCOME
       ===================================================================== */
    function showWelcome() {
      makePanel('panel-welcome',
        'GOOD EVENING, DOCTOR.\n' +
        'You are the Emergency Physician on duty tonight.\n' +
        'Three patients have just arrived in your ER.\n' +
        'Assess them. Prioritize wisely. Act fast.\n' +
        'Every second you delay, someone gets worse.',
        'hud',
        [{ label: '>>> BEGIN SHIFT <<<', color: '#1f6e2a', onClick: () => {
            AudioEngine.init();
            AudioEngine.loadMonitor('assets/icu.mp3')
              .then(() => AudioEngine.startMonitorLoop('normal'))
              .catch(() => console.warn('icu.mp3 missing'));
            clearPanel('panel-welcome');
            GAME.phase = 'OBSERVE';
            GAME.startTime = Date.now();
            updateHUD();
          } }],
        2.3, false);
    }

    /* =====================================================================
       PHASE 2 — PRIORITIZATION (with explanations)
       ===================================================================== */
    function startPrioritization() {
      GAME.phase = 'PRIORITIZE';
      updateHUD();
      setMessage('Choose which patient to attend FIRST!');
      makePanel('panel-priority', 'WHICH PATIENT WILL YOU ATTEND FIRST?', 'hud', [
        { label: 'Bed 1 - Ravi (chest injury)',  onClick: () => pickFirst('patientA') },
        { label: 'Bed 2 - Meena (thigh injury)', onClick: () => pickFirst('patientB') },
        { label: 'Bed 3 - Arjun (ankle injury)', onClick: () => pickFirst('patientC') }
      ], 2.0, false);
    }

    function pickFirst(pid) {
      clearPanel('panel-priority');
      if (pid === 'patientA') {
        addScore(20, true);
        logDebrief('Prioritization', true, 'Ravi first: SpO2 78, RR 38, BP falling - breathing compromise kills in minutes.');
        setMessage('Correct! +20. Airway & breathing kill first. Click Ravi to assign triage.');
      } else if (pid === 'patientB') {
        addScore(-10, false);
        logDebrief('Prioritization', false, 'Chose Meena first. Her fracture is urgent but stable; Ravi\'s falling SpO2 and BP mean he dies first without action.');
        setMessage('Wrong: -10. Pain is loud but hypoxia kills. Ravi\'s SpO2 is 78 and falling!');
      } else {
        addScore(-20, false);
        logDebrief('Prioritization', false, 'Chose Arjun first. A walking, talking patient is by definition the LAST priority.');
        setMessage('Wrong: -20. He is walking and talking - lowest priority. Ravi is dying!');
      }
      GAME.phase = 'TREAT';
      updateHUD();
    }

    /* =====================================================================
       PHASE 3 — TRIAGE (with explanations)
       ===================================================================== */
    const bedPanelPos = {
      patientA: '-4 1.9 -2.4',
      patientB: '0 1.9 -2.4',
      patientC: '4 1.9 -2.4'
    };

    const triageWhy = {
      patientA: 'RED: hypoxia + tachypnoea + falling BP = immediate life threat.',
      patientB: 'YELLOW: serious injury, needs treatment soon, but vitals stable.',
      patientC: 'GREEN: walking wounded - can safely wait.'
    };

    function openPatientFlow(pid) {
      if (GAME.phase !== 'TREAT') return;
      const p = GAME.patients[pid];
      if (p.dead) { setMessage(p.label + ' has died.'); return; }
      if (p.stage !== 'done') clearMoveOn();   // they moved on - stop nagging
      if (p.stage === 'triage')         showTriagePanel(pid);
      else if (p.stage === 'examine')   showExamPanel(pid);
      else if (p.stage === 'orders')    showOrdersPanel(pid);
      else if (p.stage === 'procedure') showProcedurePanel(pid);
      else setMessage(p.label + ' already managed.');
    }

    function showTriagePanel(pid) {
      const p = GAME.patients[pid];
      makePanel('panel-flow', 'ASSIGN TRIAGE CATEGORY - ' + p.label, bedPanelPos[pid], [
        { label: 'RED - Immediate',  color: '#8a1f1f', onClick: () => assignTriage(pid, 'red') },
        { label: 'YELLOW - Urgent',  color: '#8a6d1f', onClick: () => assignTriage(pid, 'yellow') },
        { label: 'GREEN - Can wait', color: '#1f6e2a', onClick: () => assignTriage(pid, 'green') }
      ], 1.8);
    }

    function assignTriage(pid, chosen) {
      const p = GAME.patients[pid];
      const ok = chosen === p.triage;
      if (ok) {
        addScore(15, true);
        setMessage('Correct triage! +15. Now examine ' + p.label + '.');
      } else {
        addScore(-15, false);
        setMessage('Wrong: -15. ' + triageWhy[pid]);
      }
      logDebrief('Triage - ' + p.label, ok, triageWhy[pid]);
      p.stage = 'examine';
      showExamPanel(pid);   // panel updates in place, no re-click needed
    }

    /* =====================================================================
       NEW — EXAMINATION + DIAGNOSIS (player discovers the diagnosis)
       ===================================================================== */
    const examConfig = {
      patientA: {
        exams: [
          { label: 'Auscultate chest',      finding: 'ABSENT breath sounds on the RIGHT.' },
          { label: 'Percuss chest',         finding: 'HYPERRESONANT right hemithorax.' },
          { label: 'Check trachea',         finding: 'Trachea DEVIATED to the LEFT.' },
          { label: 'Look at neck veins',    finding: 'Neck veins DISTENDED.' },
          { label: 'Listen to heart sounds',finding: 'Heart sounds present, not muffled. Tachycardic.' },
          { label: 'Palpate radial pulses', finding: 'Radial pulses palpable but thready in BOTH arms.' }
        ],
        dxTitle: 'DIAGNOSIS?\nStab wound + your findings',
        dx: [
          { label: 'Tension pneumothorax', correct: true,
            why: 'Absent breath sounds + hyperresonance + tracheal deviation AWAY + distended neck veins + shock. The haemodynamic compromise is what makes it TENSION rather than simple.' },
          { label: 'Simple pneumothorax', correct: false,
            why: 'A simple pneumothorax gives absent breath sounds and hyperresonance too - but NOT tracheal deviation, distended neck veins or shock. Those three make this a tension pneumothorax needing decompression NOW.' },
          { label: 'Massive haemothorax', correct: false,
            why: 'Haemothorax is DULL to percussion (blood, not air) and neck veins are FLAT from blood loss. His chest is hyperresonant and his neck veins are distended - the opposite picture.' },
          { label: 'Cardiac tamponade', correct: false,
            why: 'Tamponade also gives distended neck veins and shock, but heart sounds are MUFFLED and breath sounds and percussion are NORMAL. His breath sounds are absent and his chest is hyperresonant.' }
        ]
      },
      patientB: {
        exams: [
          { label: 'Look at the limb',       finding: 'Right thigh swollen, deformed, SHORTENED. Skin intact.' },
          { label: 'Feel distal pulses',     finding: 'Dorsalis pedis and posterior tibial PRESENT, foot warm and pink.' },
          { label: 'Check sensation in foot',finding: 'Sensation intact throughout the foot.' },
          { label: 'Examine the hip',        finding: 'Hip not flexed or internally rotated. Deformity is MID-THIGH.' },
          { label: 'Compress the pelvis',    finding: 'Pelvis STABLE and non-tender.' },
          { label: 'Repeat blood pressure',  finding: 'BP trending down slightly. Thigh circumference increasing.' }
        ],
        dxTitle: 'DIAGNOSIS?\nRoad traffic accident + your findings',
        dx: [
          { label: 'Closed femoral shaft fracture', correct: true,
            why: 'Shortened, swollen, deformed mid-thigh after high-energy trauma, with intact distal neurovascular status and a stable pelvis. Note the falling BP: a femur can bleed 1-1.5 L into the thigh.' },
          { label: 'Femoral fracture with vascular injury', correct: false,
            why: 'Clinically very close - and you must ALWAYS exclude it. But you documented present dorsalis pedis and posterior tibial pulses with a warm, pink foot. Without that examination you could not have ruled this out.' },
          { label: 'Posterior hip dislocation', correct: false,
            why: 'Also shortens the limb - but classically flexed, ADDucted and internally rotated at the HIP. Her hip examination is normal and the deformity is mid-shaft.' },
          { label: 'Pelvic fracture', correct: false,
            why: 'Also causes shortening and shock after high-energy trauma, but her pelvis is stable and non-tender on compression.' }
        ]
      },
      patientC: {
        exams: [
          { label: 'Inspect the ankle',            finding: 'Swelling and bruising BELOW and ANTERIOR to the lateral malleolus.' },
          { label: 'Palpate posterior malleoli',   finding: 'NO tenderness over the posterior edge or tip of either malleolus.' },
          { label: 'Palpate base of 5th metatarsal',finding: 'NON-tender. Navicular also non-tender.' },
          { label: 'Squeeze test (syndesmosis)',   finding: 'NEGATIVE. No tenderness above the joint line.' },
          { label: 'Ask him to walk 4 steps',      finding: 'Walks 4 steps unaided with a mild limp.' },
          { label: 'Test ankle movements',         finding: 'Pain on inversion. Plantarflexion strength normal, no palpable gap in the Achilles.' }
        ],
        dxTitle: 'DIAGNOSIS?\nInversion injury + your findings',
        dx: [
          { label: 'Lateral ligament (ATFL) sprain', correct: true,
            why: 'Ottawa ankle AND foot rules are NEGATIVE: no posterior malleolar tenderness, no 5th metatarsal or navicular tenderness, and he can weight-bear 4 steps. Negative squeeze test excludes a high ankle sprain. This is a clinical sprain - no imaging indicated.' },
          { label: 'Weber A distal fibular fracture', correct: false,
            why: 'An avulsion fracture at the lateral malleolus presents almost identically - which is exactly why the Ottawa rules exist. It requires bony tenderness over the posterior edge or tip of the malleolus. He has none.' },
          { label: 'Base of 5th metatarsal fracture', correct: false,
            why: 'The same inversion mechanism commonly causes this, and it is easily missed if you only examine the ankle. But you palpated the 5th metatarsal base and it was non-tender.' },
          { label: 'Syndesmotic (high ankle) sprain', correct: false,
            why: 'Would give tenderness ABOVE the joint line and a positive squeeze test, and typically follows external rotation rather than inversion. His squeeze test is negative.' }
        ]
      }
    };

    function showExamPanel(pid) {
      const cfg = examConfig[pid];
      const p = GAME.patients[pid];
      const buttons = cfg.exams.map(ex => ({
        label: ex.label,
        onClick: (btn) => {
          btn.dataset.selected = 'true';
          btn.setAttribute('color', '#3fa06a');
          setMessage('FINDING: ' + ex.finding);
        }
      }));
      buttons.push({
        label: '>>> MAKE DIAGNOSIS <<<', color: '#5a3f92',
        onClick: () => showDiagnosisPanel(pid)
      });
      makePanel('panel-flow', 'EXAMINE - ' + p.label + '\n(perform your examination first)', bedPanelPos[pid], buttons, 1.9);
    }

    function showDiagnosisPanel(pid) {
      const cfg = examConfig[pid];
      const buttons = shuffled(cfg.dx).map(d => ({
        label: d.label,
        onClick: () => {
          if (d.correct) {
            addScore(15, true);
            logDebrief('Diagnosis - ' + GAME.patients[pid].label, true, d.why);
            GAME.patients[pid].stage = 'orders';
            setMessage('Correct: ' + d.label + '! +15. Proceed to NURSE ORDERS.');
            showOrdersPanel(pid);   // panel updates in place, no re-click needed
          } else {
            addScore(-10, false);
            logDebrief('Diagnosis - ' + GAME.patients[pid].label, false, 'Chose ' + d.label + ': ' + d.why);
            setMessage('Wrong: -10. ' + d.why);
          }
        }
      }));
      makePanel('panel-flow', cfg.dxTitle, bedPanelPos[pid], buttons, 2.1);
    }

    /* =====================================================================
       PHASE 4 — NURSE ORDERS (per-order explanations)
       ===================================================================== */
    /* severity: 'harmful' = -10 (actively dangerous), 'excess' = -3
       (not dangerous, but wasteful / unnecessary in this patient).      */
    const ordersConfig = {
      patientA: {
        title: 'NURSE ORDERS - Ravi\n(select all that apply, then confirm)',
        options: [
          { label: 'High-flow oxygen, non-rebreather',   correct: true,
            why: 'He is profoundly hypoxic. Oxygen buys time while you prepare to decompress.' },
          { label: 'Two large-bore IVs + full monitoring',correct: true,
            why: 'Obtain access BEFORE he collapses; continuous monitoring tracks the response to decompression.' },
          { label: 'Prepare needle decompression kit',    correct: true,
            why: 'Tension pneumothorax is treated immediately at the bedside - the kit must be ready before you start.' },
          { label: 'Alert surgery for chest drain',       correct: true,
            why: 'The needle is temporizing only. Definitive management is an intercostal drain, so the team must be moving now.' },
          { label: 'Portable chest X-ray before treating',correct: false, severity: 'harmful',
            why: 'The classic trap. Tension pneumothorax is a CLINICAL diagnosis - waiting for a film costs minutes he does not have. Imaging is appropriate only for a stable pneumothorax.' },
          { label: 'Intubate and ventilate now',          correct: false, severity: 'harmful',
            why: 'Tempting because he is hypoxic - but positive-pressure ventilation forces more air into the pleural space and can precipitate arrest. Decompress FIRST.' },
          { label: 'CT chest for full trauma survey',     correct: false, severity: 'excess',
            why: 'An unstable patient does not go to the scanner. Resuscitate first; image later if still indicated.' },
          { label: 'IV morphine for pain',                correct: false, severity: 'harmful',
            why: 'Opioids depress respiration in a peri-arrest hypoxic patient. Treat the cause of his distress, not the sensation.' }
        ]
      },
      patientB: {
        title: 'NURSE ORDERS - Meena\n(select all that apply, then confirm)',
        options: [
          { label: 'Two large-bore IVs + warmed fluids',  correct: true,
            why: 'A closed femoral shaft fracture can sequester 1-1.5 litres of blood into the thigh.' },
          { label: 'Titrated IV analgesia',               correct: true,
            why: 'Severe pain warrants adequate, titrated analgesia - it is humane and reduces the physiological stress response.' },
          { label: 'Immobilise the limb',                 correct: true,
            why: 'Reduces pain, further blood loss and the risk of fat embolism.' },
          { label: 'X-ray femur incl. joint above & below',correct: true,
            why: 'Standard practice: always image the joint above and below a long-bone fracture.' },
          { label: 'Group and crossmatch',                correct: true,
            why: 'Anticipates transfusion given the potential blood loss and likely operative fixation.' },
          { label: 'Recheck distal pulses after splinting',correct: true,
            why: 'Neurovascular status MUST be documented before and after any manipulation or splinting.' },
          { label: 'CT angiogram of the limb',            correct: false, severity: 'excess',
            why: 'Not indicated when distal pulses are present and the foot is warm and pink. Reserve for suspected vascular injury.' },
          { label: 'Oral analgesia only',                 correct: false, severity: 'excess',
            why: 'Inadequate for a femoral shaft fracture, and unreliable absorption in a shocked patient.' }
        ]
      },
      patientC: {
        title: 'NURSE ORDERS - Arjun\n(select all that apply, then confirm)',
        options: [
          { label: 'Ice and elevation',                   correct: true,
            why: 'Reduces swelling and pain in the acute phase.' },
          { label: 'Elastic compression support',         correct: true,
            why: 'Supports the injured lateral ligaments and limits swelling.' },
          { label: 'Oral NSAID analgesia',                correct: true,
            why: 'Simple oral analgesia is sufficient for a ligamentous sprain.' },
          { label: 'X-ray ankle',                         correct: false, severity: 'excess',
            why: 'Ottawa ankle rules are NEGATIVE. Imaging here adds radiation, cost and department time with no change in management.' },
          { label: 'X-ray foot',                          correct: false, severity: 'excess',
            why: 'Ottawa foot rules are also negative - no 5th metatarsal or navicular tenderness, and he can weight-bear.' },
          { label: 'IV opioid analgesia',                 correct: false, severity: 'excess',
            why: 'Disproportionate for a sprain, and exposes him to unnecessary risk in a patient who can go home.' },
          { label: 'Orthopaedic referral today',          correct: false, severity: 'excess',

    function showOrdersPanel(pid) {
      const cfg = ordersConfig[pid];
      const selections = new Set();
      // shuffle the ORDER ITEMS inside the panel so position never hints at
      // the answer; the sequence of stages is unchanged.
      const shuffledOpts = shuffled(cfg.options);
      const buttons = shuffledOpts.map((opt) => ({
        label: opt.label,
        onClick: (btn) => {
          if (selections.has(opt)) {
            selections.delete(opt);
            btn.dataset.selected = 'false';
            btn.setAttribute('color', btn.dataset.basecolor);
          } else {
            selections.add(opt);
            btn.dataset.selected = 'true';
            btn.setAttribute('color', '#3fa06a');
          }
        }
      }));
      buttons.push({
        label: '>>> CONFIRM ORDERS <<<', color: '#5a3f92',
        onClick: () => confirmOrders(pid, selections)
      });
      makePanel('panel-flow', cfg.title, bedPanelPos[pid], buttons, 1.9);
    }

    function confirmOrders(pid, selections) {
      const cfg = ordersConfig[pid];
      const pname = GAME.patients[pid].label;
      let pts = 0, rightPicks = 0, totalRight = 0, issues = 0;
      let harmful = 0, excess = 0;
      cfg.options.forEach((opt) => {
        const picked = selections.has(opt);
        if (opt.correct) totalRight++;
        if (picked) {
          if (opt.correct) { pts += 5; rightPicks++; }
          else {
            // graded penalty: actively dangerous costs far more than wasteful
            if (opt.severity === 'harmful') { pts -= 10; harmful++; }
            else                            { pts -= 3;  excess++; }
            issues++;
            logDebrief('Order - ' + pname + ': ' + opt.label, false,
              (opt.severity === 'harmful' ? '[HARMFUL] ' : '[UNNECESSARY] ') + opt.why);
          }
        } else if (opt.correct) {
          issues++;
          logDebrief('Missed order - ' + pname + ': ' + opt.label, false, opt.why);
        }
      });
      if (issues === 0) logDebrief('Nurse orders - ' + pname, true,
        'All indicated orders given, nothing harmful and nothing wasteful.');
      const isGood = rightPicks >= Math.ceil(totalRight * 0.75) && pts > 0;
      addScore(pts, isGood);
      GAME.patients[pid].stage = 'procedure';
      let note = '';
      if (harmful) note += ' ' + harmful + ' potentially HARMFUL order(s).';
      if (excess)  note += ' ' + excess + ' unnecessary order(s).';
      setMessage('Orders: ' + (pts >= 0 ? '+' : '') + pts +
        (issues ? '.' + note + ' See debrief.' : '. Flawless!'));
      showProcedurePanel(pid);   // panel updates in place, no re-click needed
    }

    /* =====================================================================
       PHASE 5 — PROCEDURES
       ===================================================================== */
    function showProcedurePanel(pid) {
      if (pid === 'patientA') return decompressionRouter();
      if (pid === 'patientB') return showSplintChoice();
      if (pid === 'patientC') return showDischargeChoice();
    }

    /* ---------- DISCHARGE PLAN (Arjun) - all four are plausible plans ---------- */
    const dischargeOptions = [
      { label: 'RICE + weight-bear as tolerated + support + NSAID + return advice',
        correct: true,
        why: 'Current guidance for a Grade I-II lateral sprain: early protected mobilisation recovers faster than immobilisation. Return advice covers the small miss rate of the Ottawa rules.' },
      { label: 'Below-knee cast, non-weight-bearing for 6 weeks',
        correct: false,
        why: 'The "safe over-treatment" trap. Casting a simple sprain causes joint stiffness, muscle wasting and a slower return to function - and carries VTE risk. Over-treatment is still harm.' },
      { label: 'Complete rest with crutches, no weight-bearing for 2 weeks',
        correct: false,
        why: 'Milder version of the same error. Prolonged non-weight-bearing delays recovery; the evidence favours early mobilisation within the limits of pain.' },
      { label: 'X-ray first, then RICE and discharge',
        correct: false,
        why: 'Ottawa ankle and foot rules are both negative, so the X-ray changes nothing. It adds radiation, cost and department time - the definition of an unnecessary investigation.' }
    ];

    function showDischargeChoice() {
      const buttons = shuffled(dischargeOptions).map(o => ({
        label: o.label,
        onClick: () => {

            addScore(10, true);
            logDebrief('Disposition - Arjun', true, o.why);
            clearPanel('panel-flow');
            finishPatient('patientC', 'Discharged appropriately! +10. Early mobilisation with return advice.');
          } else {
            addScore(-5, false);
            logDebrief('Disposition - Arjun', false, 'Chose: ' + o.label + '. ' + o.why);
            setMessage('Not the best plan: -5. ' + o.why);
          }
        }
      }));
      makePanel('panel-flow', 'DISCHARGE PLAN - Arjun\nWhich plan will you give him?',
                bedPanelPos.patientC, buttons, 2.3);
    }

    /* ---------- SPLINT (Meena) - all four are real lower-limb devices ---------- */
    const splintOptions = [
      { label: 'Thomas / traction splint', correct: true,
        why: 'A femoral shaft fracture needs TRACTION: it realigns the shaft, controls the proximal fragment against powerful thigh muscle pull, and reduces bleeding into the thigh and pain.' },
      { label: 'Long-leg posterior (above-knee) slab', correct: false,
        why: 'A real and useful device - it does immobilise the limb, but applies NO traction, so the femoral fragments stay overriding under muscle pull and continue to bleed.' },
      { label: 'Vacuum / box splint', correct: false,
        why: 'Genuine prehospital lower-limb splint and comfortable for tibial injuries, but again provides no traction and does not control a mid-shaft femoral fracture.' },
      { label: 'Pelvic binder', correct: false,
        why: 'Correct device for the WRONG diagnosis. Her pelvis is stable and non-tender on examination; a binder does nothing for a mid-shaft femoral fracture.' }
    ];

    function showSplintChoice() {
      const buttons = shuffled(splintOptions).map(o => ({
        label: o.label,
        onClick: () => {
          if (o.correct) {
            logDebrief('Splint - Meena', true, o.why);
            applySplint();
          } else {
            addScore(-10, false);
            logDebrief('Splint - Meena', false, 'Chose: ' + o.label + '. ' + o.why);
            setMessage('Not the right splint: -10. ' + o.why);
          }
        }
      }));
      makePanel('panel-flow', 'SELECT THE SPLINT\nMid-shaft femoral fracture',
                bedPanelPos.patientB, buttons, 2.3);
    }

    function applySplint() {
      clearPanel('panel-flow');
      const leg = document.querySelector('#patientB');
      const splint = document.createElement('a-entity');
      splint.setAttribute('id', 'splintB');
      splint.innerHTML = `
        <a-cylinder position="0.02 0.47 0.72" rotation="90 0 0" radius="0.012" height="0.95" color="#b9c2c6" metalness="0.6"></a-cylinder>
        <a-cylinder position="0.30 0.47 0.72" rotation="90 0 0" radius="0.012" height="0.95" color="#b9c2c6" metalness="0.6"></a-cylinder>

        <a-box position="0.16 0.50 0.80" width="0.34" height="0.16" depth="0.05" color="#e8e4d8"></a-box>

    /* ---------- HANDS-ON NEEDLE DECOMPRESSION (Ravi) ----------
       help -> oxygen -> position -> site (FPS targeting)
       -> clean  (GRAB the swab from the bedside tray, RUB the site)
       -> insert (GRAB the cannula, TOUCH it to the site)
       -> secure -> done                                              */
    const decompSites = [
      { id: 'site-r2ics',  pos: '-0.16 0.68 -0.40', rot: '-90 0 0',
        label: '2nd ICS\nmidclavicular (R)', correct: true },
      { id: 'site-r5icsma',pos: '-0.30 0.56 -0.12', rot: '0 0 -90',
        label: '5th ICS\nmidaxillary (R)',   correct: true },
      { id: 'site-sternum',pos: '0 0.68 -0.32',     rot: '-90 0 0',
        label: 'Sternum',                    correct: false },
      { id: 'site-l2ics',  pos: '0.16 0.68 -0.40',  rot: '-90 0 0',
        label: '2nd ICS\nmidclavicular (L)', correct: false }
    ];

    const TOOLS = { held: null, heldType: null, cleaned: false, origParent: null, origPos: null };

    /* Neutral prompt - the game asks, it never names the tool. The player must
       recall the correct sequence (asepsis before puncture) themselves. */
    const ASK = "What's your next step? Select the suitable one from the tray.";

    function decompressionRouter() {
      const st = GAME.decomp.stage;
      if (!st || st === 'help') return decompStepHelp();
      if (st === 'oxygen')      return decompStepOxygen();
      if (st === 'position')    return decompStepPosition();
      if (st === 'site')        return setMessage('Aim at the correct site on his chest and pull the trigger!');
      if (st === 'clean')       return setMessage("What's your next step? Select the suitable one from the tray.");
      if (st === 'insert')      return setMessage("What's your next step? Select the suitable one from the tray.");
      if (st === 'secure')      return decompStepSecure();
    }

    function decompStepHelp() {
      GAME.decomp.stage = 'help';
      makePanel('panel-flow', 'NEEDLE DECOMPRESSION - STEP 1\nTension pneumothorax confirmed.', bedPanelPos.patientA, [
        { label: 'Call for help + inform team', onClick: () => {
            addScore(5, true);
            GAME.decomp.stage = 'oxygen';
            decompStepOxygen();
          } }
      ], 2.0);
    }
    function decompStepOxygen() {
      makePanel('panel-flow', 'STEP 2 - Oxygenation', bedPanelPos.patientA, [
        { label: 'High-flow O2, 15L non-rebreather mask', onClick: () => {
            addScore(5, true);
            GAME.decomp.stage = 'position';
            decompStepPosition();
          } }
      ], 2.0);
    }
    function decompStepPosition() {
      makePanel('panel-flow', 'STEP 3 - Position the patient', bedPanelPos.patientA, [
        { label: 'Supine, expose the chest fully', onClick: () => {
            addScore(5, true);
            clearPanel('panel-flow');
            GAME.decomp.stage = 'site';
            spawnSiteTargets();
            setMessage('STEP 4: Identify the site. Aim at the correct target on his chest and pull the trigger!');
          } }
      ], 2.0);
    }

    function spawnSiteTargets() {
      const pA = document.querySelector('#patientA');
      // The generous body hit-volume would sit in front of the chest reticles
      // and swallow their clicks, so stand it down while targeting is active.
      const catcher = pA.querySelector('[patient-select]');
      if (catcher) catcher.setAttribute('visible', 'false'), catcher.classList.remove('clickable');
      decompSites.forEach(s => {
        const t = document.createElement('a-entity');
        t.setAttribute('id', s.id);
        t.setAttribute('position', s.pos);
        t.setAttribute('rotation', s.rot);
        t.innerHTML = `
          <a-circle class="clickable" radius="0.085" opacity="0.001" material="transparent: true"></a-circle>
          <a-ring class="clickable" color="#ff4444" radius-inner="0.028" radius-outer="0.045"

          <a-circle class="clickable" color="#ffffff" radius="0.012" position="0 0 0.001"></a-circle>
          <a-text value="${s.label}" position="0 0.09 0.002" align="center" color="#ffffff" width="0.55"></a-text>`;
        pA.appendChild(t);
        setTimeout(() => {
          t.querySelectorAll('.clickable').forEach(c =>
            c.addEventListener('click', () => onSiteClick(s)));
        }, 50);
      });
      refreshRaycasters();
    }

    function onSiteClick(site) {
      if (GAME.decomp.stage === 'site') {
        if (site.correct) {
          addScore(20, true);
          logDebrief('Decompression site', true, site.label.replace('\n', ' ') +
            ': correct. ATLS now favours 5th ICS midaxillary in adults (thinner chest wall = fewer failed needles), 2nd ICS MCL remains acceptable.');
          GAME.decomp.site = site;
          GAME.decomp.stage = 'clean';
          decompSites.forEach(s => {
            const el = document.querySelector('#' + s.id);
            if (!el) return;
            if (s.id !== site.id) el.parentNode.removeChild(el);
            else el.querySelector('a-ring').setAttribute('color', '#3fff7a');
          });
          spawnProcedureTray();
          setMessage("Site confirmed! +20. " + ASK);
        } else {
          addScore(-15, false);
          const why = site.id === 'site-sternum'
            ? 'Never the sternum - no pleural space there, only heart and great vessels beneath.'
            : 'Wrong SIDE - his findings are all on the RIGHT. Decompressing the left could collapse his only working lung.';
          logDebrief('Decompression site', false, why);
          setMessage('WRONG SITE: -15. ' + why);
        }
        return;
      }

      // acting on the already-confirmed site with whatever tool is in hand
      if (!GAME.decomp.site || site.id !== GAME.decomp.site.id) return;

      if (GAME.decomp.stage === 'clean') {
        if (TOOLS.heldType === 'swab') performWipe();
        else if (TOOLS.heldType === 'cannula') {
          addScore(-5, false);
          logDebrief('Asepsis', false, 'Went to puncture without disinfecting - infection risk. Clean the site first.');
          setMessage('STOP: -5. Disinfect the site with the swab FIRST!');
        } else if (TOOLS.heldType === 'insulin' || TOOLS.heldType === 'scalpel') {
          wrongToolPenalty();
        } else {
          setMessage("Nothing in your hand. " + ASK);
        }
      } else if (GAME.decomp.stage === 'insert') {
        if (TOOLS.heldType === 'cannula') performInsertion();
        else if (TOOLS.heldType === 'insulin' || TOOLS.heldType === 'scalpel') wrongToolPenalty();
        else setMessage("Nothing in your hand. " + ASK);
      }
    }

    function performWipe() {
      addScore(5, true);
      logDebrief('Asepsis', true, 'Site disinfected before puncture - clean technique protects against empyema.');
      const swab = TOOLS.held;
      TOOLS.held = null; TOOLS.heldType = null;
      if (swab && swab.parentNode) swab.parentNode.removeChild(swab);
      TOOLS.cleaned = true;
      GAME.decomp.stage = 'insert';
      setMessage("Wiping... site is clean. +5. " + ASK);
    }

    function wrongToolPenalty() {
      const why = TOOLS.heldType === 'insulin'
        ? 'An insulin syringe needle is far too short to reach the pleural space.'
        : 'A scalpel is for surgical thoracostomy, not needle decompression.';
      addScore(-10, false);
      logDebrief('Instrument choice', false, why);
      setMessage('Wrong tool: -10. ' + why + ' It goes back on the tray.');
      returnHeldTool();
    }

        </a-entity>

            part.addEventListener('click', (evt) => grabTool(toolEl, type, evt)));

    }

    function grabTool(toolEl, type, evt) {
      if (TOOLS.held === toolEl) return;
      returnHeldTool();
      const hand = (evt.detail && evt.detail.cursorEl) ? evt.detail.cursorEl
                   : document.querySelector('#rhand');
      TOOLS.origParent = toolEl.parentNode;
      TOOLS.origPos = Object.assign({}, toolEl.getAttribute('position'));
      hand.appendChild(toolEl);
      toolEl.setAttribute('position', '0 -0.04 -0.15');
      toolEl.setAttribute('rotation', '-40 0 0');
      TOOLS.held = toolEl;
      TOOLS.heldType = type;
      if (type === 'swab')    setMessage(GAME.decomp.stage === 'clean'
        ? 'Good choice - antiseptic swab. Now point at the target on the patient and pull the trigger to disinfect.'
        : 'The site is already disinfected. ' + ASK);
      if (type === 'cannula') setMessage(TOOLS.cleaned
        ? 'Good choice - 14G cannula. Now point at the target on the patient and pull the trigger to insert.'
        : 'Cannula in hand - but is the site ready for a puncture yet?');
      if (type === 'insulin' || type === 'scalpel')
        setMessage('You picked up the ' + (type === 'insulin' ? 'insulin syringe' : 'scalpel') + '. Is that what this step needs?');
    }

    function returnHeldTool() {
      if (!TOOLS.held) return;
      TOOLS.origParent.appendChild(TOOLS.held);
      TOOLS.held.setAttribute('position', TOOLS.origPos);
      TOOLS.held.setAttribute('rotation', '0 0 0');
      TOOLS.held = null;
      TOOLS.heldType = null;
    }

    function performInsertion() {
      if (GAME.decomp.stage !== 'insert') return;
      const site = GAME.decomp.site;
      const el = document.querySelector('#' + site.id);
      AudioEngine.hiss();
      if (TOOLS.held && TOOLS.heldType === 'cannula') {
        TOOLS.held.parentNode.removeChild(TOOLS.held);
        TOOLS.held = null; TOOLS.heldType = null;
      }
      const cannula = document.createElement('a-entity');
      cannula.innerHTML = `
        <a-cylinder position="0 0 0.045" rotation="90 0 0" radius="0.004" height="0.06" color="#dfe4e6"></a-cylinder>
        <a-cone position="0 0 0.095" rotation="-90 0 0" radius-bottom="0.016" radius-top="0.006" height="0.035" color="#e8641b"></a-cone>
        <a-cylinder position="0 0 0.125" rotation="90 0 0" radius="0.014" height="0.025" color="#f0f0f0" opacity="0.85"></a-cylinder>`;
      el.appendChild(cannula);
      el.querySelector('a-ring').setAttribute('visible', 'false');
      const pA = document.querySelector('#patientA');
      if (!pA.components.patient.data.dead) {
        pA.setAttribute('patient', 'treated', true);
        addScore(15, true);
        logDebrief('Insertion technique', true, 'Inserted just above the upper border of the rib - the intercostal vessels and nerve run BELOW each rib.');
        GAME.decomp.stage = 'secure';
        setMessage('HISSSS... air escapes! +15. SpO2 climbing.');
        decompStepSecure();   // panel updates in place, no re-click needed
      }
    }

    function decompStepSecure() {
      makePanel('panel-flow', 'FINAL STEP - Decompressed!\nVitals recovering.', bedPanelPos.patientA, [
        { label: 'Secure cannula + reassess ABCDE', onClick: () => {
            addScore(5, true);
            clearPanel('panel-flow');
            clearPanel('proc-tray');
            GAME.decomp.stage = 'done';
            logDebrief('Definitive care', true, 'Needle decompression is TEMPORIZING only - definitive treatment is a chest drain. Surgery team already called. Always reassess after every intervention.');
            finishPatient('patientA', 'Secured! The needle buys time - the chest drain cures. Surgery is on the way.');
          } }
      ], 2.1);
    }

    /* ---- "you're in an ER, move" nudges ----
       Once a patient is finished, lingering costs the others time. Escalating
       prompts fire at 5 / 10 / 15 s and stop as soon as the doctor starts
       working on someone else (or the shift ends).                        */
    let MOVE_ON_TIMERS = [];
    function clearMoveOn() {
      MOVE_ON_TIMERS.forEach(t => clearTimeout(t));
      MOVE_ON_TIMERS = [];
    }
    function startMoveOn(justFinished) {
      clearMoveOn();
      const waiting = Object.keys(GAME.patients)
        .filter(k => GAME.patients[k].stage !== 'done' && !GAME.patients[k].dead);
      if (!waiting.length) return;              // nobody left, no nudge
      const n = waiting.length;
      const nudges = [
        [5000,  justFinished + ' is stable and the team is on it. ' +
                n + ' patient' + (n > 1 ? 's' : '') + ' still waiting.'],
        [10000, "You're in an ER, doctor. Move."],
        [15000, "Every second here is a second someone else doesn't have. GO."]
      ];
      nudges.forEach(([ms, text]) => {
        MOVE_ON_TIMERS.push(setTimeout(() => {
          if (GAME.phase === 'TREAT') setMessage(text);
        }, ms));
      });
    }

    function finishPatient(pid, msg) {
      const p = GAME.patients[pid];
      p.stage = 'done';
      p.saved = !p.dead;
      setMessage(msg);
      checkEnd();
      if (GAME.phase === 'TREAT') startMoveOn(p.label);
    }

    /* =====================================================================
       END SCREEN + CLINICAL DEBRIEF
       ===================================================================== */
    function checkEnd() {
      const ps = GAME.patients;
      const allDone = Object.values(ps).every(p => p.stage === 'done' || p.dead);
      if (!allDone) return;
      GAME.phase = 'END';
      updateHUD();
      showResults();
    }

    function showResults() {
      const ps = GAME.patients;
      const saved = Object.values(ps).filter(p => p.saved).length;
      const acc = GAME.decisionsTotal ? Math.round(100 * GAME.decisionsCorrect / GAME.decisionsTotal) : 0;
      const elapsed = Math.round((Date.now() - GAME.startTime) / 1000);
      let rank = 'Beginner';
      if (GAME.score >= 160) rank = 'TRAUMA EXPERT';
      else if (GAME.score >= 115) rank = 'Emergency Physician';
      else if (GAME.score >= 70) rank = 'Junior Resident';

      makePanel('panel-end',
        'SHIFT COMPLETE\nPatients saved: ' + saved + '/3' +
        '\nDecision accuracy: ' + acc + '%' +
        '\nTotal time: ' + elapsed + 's' +
        '\nFINAL SCORE: ' + GAME.score +
        '\nRANK: ' + rank,
        'hud',
        [
          { label: 'VIEW CLINICAL DEBRIEF', color: '#5a3f92', onClick: () => showDebriefPage(0) },
          { label: 'RESTART SIMULATION', onClick: () => location.reload() }
        ],
        2.1, false);
    }

    const DEBRIEF_PER_PAGE = 4;
    function showDebriefPage(page) {
      clearPanel('panel-end');
      const totalPages = Math.max(1, Math.ceil(DEBRIEF.length / DEBRIEF_PER_PAGE));
      const entries = DEBRIEF.slice(page * DEBRIEF_PER_PAGE, (page + 1) * DEBRIEF_PER_PAGE);
      const lines = entries.map(e =>
        (e.ok ? '[GOOD] ' : '[REVIEW] ') + e.topic + '\n' + e.why
      ).join('\n\n');
      const title = 'CLINICAL DEBRIEF  (' + (page + 1) + '/' + totalPages + ')\n\n' +
        (lines || 'No decisions recorded.');
      const buttons = [];
      if (page > 0) buttons.push({ label: '< Previous', onClick: () => showDebriefPage(page - 1) });
      if ((page + 1) * DEBRIEF_PER_PAGE < DEBRIEF.length)
        buttons.push({ label: 'Next >', onClick: () => showDebriefPage(page + 1) });
      buttons.push({ label: 'Back to results', onClick: () => { clearPanel('panel-debrief'); showResults(); } });
      buttons.push({ label: 'RESTART SIMULATION', onClick: () => location.reload() });
      makePanel('panel-debrief', title, 'hud', buttons, 2.6, false);
    }

    /* =====================================================================
       FLOOR DETAIL
       ===================================================================== */
    function buildFloorDetail() {
      const scene = document.querySelector('a-scene');
      const mk = (w, h, pos, rot, color) => {
        const p = document.createElement('a-plane');
        p.setAttribute('width', w); p.setAttribute('height', h);
        p.setAttribute('position', pos); p.setAttribute('rotation', rot);
        p.setAttribute('color', color);
        scene.appendChild(p);
      };
      for (let x = -6; x <= 6; x++) mk(0.02, 10, x + ' 0.002 0', '-90 0 0', '#8f9ea2');
      for (let z = -4; z <= 4; z++) mk(14, 0.02, '0 0.002 ' + z, '-90 0 0', '#8f9ea2');
      mk(14, 0.18, '0 0.09 -4.99', '0 0 0', '#5f7276');
      mk(14, 0.18, '0 0.09 4.99', '0 180 0', '#5f7276');
      mk(10, 0.18, '-6.99 0.09 0', '0 90 0', '#5f7276');
      mk(10, 0.18, '6.99 0.09 0', '0 -90 0', '#5f7276');
    }

    /* =====================================================================
       A-FRAME COMPONENTS
       ===================================================================== */
    AFRAME.registerComponent('patient', {
      schema: {
        hr: { default: 80 }, spo2: { default: 98 },
        bpSys: { default: 120 }, bpDia: { default: 80 }, rr: { default: 14 },
        deteriorates: { default: false }, treated: { default: false }, dead: { default: false }
      },
      init: function () {
        this.elapsed = 0; this.tickAccum = 0;
        this.monitor = document.querySelector('#' + this.el.id + '-monitor');
      },
      tick: function (time, delta) {
        if (GAME.phase === 'WELCOME') return;
        this.tickAccum += delta;
        if (this.tickAccum < 1000) return;
        this.tickAccum = 0;
        this.elapsed += 1;
        const d = this.data;
        if (d.deteriorates && !d.treated && !d.dead) this.deteriorate();
        if (d.treated && !d.dead) this.recover();
        this.updateMonitor();
      },
      deteriorate: function () {
        const d = this.data;
        if (this.elapsed <= 70) {
          d.spo2 = Math.max(60, d.spo2 - 0.28);
          d.hr = Math.min(150, d.hr + 0.35);
          d.rr = Math.min(44, d.rr + 0.1);
        } else if (this.elapsed <= 150) {
          d.spo2 = Math.max(48, d.spo2 - 0.25);
          d.hr = Math.min(162, d.hr + 0.2);
          d.bpSys = Math.max(48, d.bpSys - 0.55);
          d.bpDia = Math.max(28, d.bpDia - 0.35);
        } else {
          d.dead = true;
          d.hr = 0; d.spo2 = 0; d.bpSys = 0; d.bpDia = 0; d.rr = 0;
          GAME.patients[this.el.id].dead = true;
          GAME.patients[this.el.id].stage = 'done';
          GAME.score -= 50;
          AudioEngine.flatlineStart();
          logDebrief('Patient death - Ravi', false, 'Tension pneumothorax untreated for too long: obstructive shock then cardiac arrest. Needle decompression within minutes is life-saving.');
          setMessage('CARDIAC ARREST - Ravi has died. -50 points.');
          updateHUD();
          checkEnd();
        }
      },
      recover: function () {
        const d = this.data;
        d.spo2 = Math.min(97, d.spo2 + 0.8);
        d.hr = Math.max(96, d.hr - 0.8);
        d.bpSys = Math.min(116, d.bpSys + 0.8);
        d.bpDia = Math.min(76, d.bpDia + 0.5);
        d.rr = Math.max(18, d.rr - 0.25);
      },
      updateMonitor: function () {
        if (!this.monitor) return;
        const d = this.data;
        const set = (sel, val) => {
          const el = this.monitor.querySelector(sel);
          if (el) el.setAttribute('value', val);
        };
        set('.hr', d.dead ? 'HR   --- ASYSTOLE' : 'HR   ' + Math.round(d.hr));
        set('.spo2', 'SpO2 ' + Math.round(d.spo2) + '%');
        set('.bp', 'BP   ' + Math.round(d.bpSys) + '/' + Math.round(d.bpDia));
        set('.rr', 'RR   ' + Math.round(d.rr));
        const frame = this.monitor.querySelector('.frame');
        const critical = (d.spo2 < 85 || d.bpSys < 80) && !d.dead;
        if (d.dead) frame.setAttribute('color', '#111111');
        else if (critical) frame.setAttribute('color', (this.elapsed % 2 === 0) ? '#ff2222' : '#5a0000');
        else frame.setAttribute('color', '#16323a');
      }
    });

    AFRAME.registerComponent('patient-select', {
      schema: { pid: { default: '' } },
      init: function () {
        this.el.addEventListener('click', () => openPatientFlow(this.data.pid));
      }
    });

    AFRAME.registerComponent('breathing', {
      schema: { fast: { default: false } },
      init: function () {
        this.el.setAttribute('animation', {
          property: 'scale', from: '1 1 1', to: '1.02 1.02 1.06',
          dir: 'alternate', loop: true,
          dur: this.data.fast ? 700 : 2000, easing: 'easeInOutSine'
        });
      }
    });

    /* =====================================================================
       GAME MANAGER
       ===================================================================== */
    AFRAME.registerComponent('game-manager', {
      init: function () {
        this.obsLeft = GAME.observeTime;
        this.secAccum = 0;
        updateHUD();
        setMessage('Welcome, Doctor.');
        buildFloorDetail();
        setTimeout(showWelcome, 500);
      },
      tick: function (time, delta) {
        if (GAME.phase === 'WELCOME') return;
        this.secAccum += delta;
        if (this.secAccum >= 1000) {
          this.secAccum = 0;
          if (GAME.phase === 'OBSERVE') {
            this.obsLeft -= 1;
            if (this.obsLeft <= 0) startPrioritization();
            else setMessage('PHASE 1 - OBSERVATION. Assess all 3 patients. Time left: ' + this.obsLeft + 's');
          }
        }
        const pA = document.querySelector('#patientA');
        if (!pA || !pA.components.patient) return;
        const d = pA.components.patient.data;
        if (d.dead) return;
        const critical = d.spo2 < 85 || d.bpSys < 80;
        const rate = Math.min(1.35, Math.max(0.85, 0.8 + (d.hr - 80) * 0.006));
        AudioEngine.setMonitorState(critical, rate);
      }
    });
    </script>

                    position="0 -0.028 0.006" align="center" color="#eafcff"
                    width="0.55" wrap-count="34" baseline="center"></a-text>

          <!-- Room-level panels (welcome / prioritization / results / debrief)
               are parented here so they pop up just above the status HUD and
               follow the doctor's view instead of sitting in the middle of
               the room. Empty until a panel opens. -->
          <a-entity id="hud-anchor" position="0 -0.24 -0.85" rotation="-12 0 0"></a-entity>

          <!-- Desktop-click / mobile-tap reticle: same raycaster + click events as
               the VR laser controllers, but aimed by looking (mouse-drag or phone
               tilt) and fired with a mouse click or screen tap. Auto-hides once a
               real VR headset session starts, since the laser controllers take
               over at that point. -->
          <a-entity id="gaze-cursor"
                    cursor="fuse: false; rayOrigin: mouse"
                    raycaster="objects: .clickable; far: 8"
                    geometry="primitive: ring; radiusInner: 0.006; radiusOuter: 0.010"
                    material="color: #7fe9ff; shader: flat; opacity: 0.9"
                    position="0 0 -0.6"></a-entity>
        </a-entity>

        <a-entity id="lhand" laser-controls="hand: left" raycaster="objects: .clickable; far: 8"></a-entity>
        <a-entity id="rhand" laser-controls="hand: right" raycaster="objects: .clickable; far: 8"></a-entity>

      <script>
        // Hide the flatscreen reticle once real VR starts, restore it if VR exits.
        document.querySelector('a-scene').addEventListener('enter-vr', () => {
          const gc = document.querySelector('#gaze-cursor');
          if (gc) gc.setAttribute('visible', 'false');
          setJoystickVisible(false);
        });
        document.querySelector('a-scene').addEventListener('exit-vr', () => {
          const gc = document.querySelector('#gaze-cursor');
          if (gc) gc.setAttribute('visible', 'true');
          setJoystickVisible(isTouchDevice());
        });

        /* ================= MOBILE VIRTUAL JOYSTICK =================
           Drag the pad to walk in any direction. "Forward" is wherever
           the camera is looking, so gyroscope turning + joystick walking
           work together naturally. Touch devices only.               */
        function isTouchDevice() {
          return ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        }
        function setJoystickVisible(v) {
          const z = document.getElementById('joy-zone');
          const h = document.getElementById('joy-hint');
          if (z) z.style.display = v ? 'block' : 'none';
          if (h) h.style.display = v ? 'block' : 'none';
        }

        const JOY = { active: false, dx: 0, dy: 0, id: null };

        (function initJoystick() {
          if (!isTouchDevice()) return;      // laptop + headset untouched
          setJoystickVisible(true);

          const zone = document.getElementById('joy-zone');
          const knob = document.getElementById('joy-knob');
          const MAXR = 45;                    // px the knob can travel

          function setKnob(dx, dy) {
            knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
          }
          function fromTouch(t) {
            const r = zone.getBoundingClientRect();
            let dx = t.clientX - (r.left + r.width / 2);
            let dy = t.clientY - (r.top + r.height / 2);
            const d = Math.hypot(dx, dy);
            if (d > MAXR) { dx = dx / d * MAXR; dy = dy / d * MAXR; }
            setKnob(dx, dy);
            JOY.dx = dx / MAXR;               // -1..1
            JOY.dy = dy / MAXR;               // -1..1 (screen-down positive)
          }

          zone.addEventListener('touchstart', e => {
            const t = e.changedTouches[0];
            JOY.active = true; JOY.id = t.identifier;
            fromTouch(t);
            e.preventDefault();
          }, { passive: false });

          zone.addEventListener('touchmove', e => {
            for (const t of e.changedTouches) {
              if (t.identifier === JOY.id) { fromTouch(t); break; }
            }
            e.preventDefault();
          }, { passive: false });

          function endTouch(e) {
            for (const t of e.changedTouches) {
              if (t.identifier === JOY.id) {
                JOY.active = false; JOY.dx = 0; JOY.dy = 0; JOY.id = null;
                setKnob(0, 0);
                break;
              }
            }
          }
          zone.addEventListener('touchend', endTouch);
          zone.addEventListener('touchcancel', endTouch);
        })();

        /* Moves the rig each frame based on joystick input, in the direction
           the camera is currently facing. */
        AFRAME.registerComponent('joystick-move', {
          init: function () {
            this.speed = 1.6;                 // metres per second
            this.camEl = this.el.querySelector('[camera]');
          },
          tick: function (time, delta) {
            if (!JOY.active || (JOY.dx === 0 && JOY.dy === 0)) return;
            if (!this.camEl) return;
            const dt = delta / 1000;
            const yaw = this.camEl.object3D.rotation.y;
            // forward = -Z rotated by yaw; joystick up (negative dy) = forward
            const fwd = -JOY.dy, strafe = JOY.dx;
            const sin = Math.sin(yaw), cos = Math.cos(yaw);
            const mx = (strafe * cos - fwd * sin) * this.speed * dt;
            const mz = (strafe * sin + fwd * cos) * this.speed * dt;
            const p = this.el.object3D.position;
            // keep the doctor inside the ER (room is 14 x 10)
            p.x = Math.max(-6.4, Math.min(6.4, p.x + mx));
            p.z = Math.max(-4.4, Math.min(4.4, p.z + mz));
          }
        });
      </script>

    </a-scene>

    <!-- ============ MOBILE VIRTUAL JOYSTICK (touch devices only) ============
         Hidden by default; shown only when a touch screen is detected and we
         are NOT in an immersive headset session. Laptop and VR are untouched. -->
    <div id="joy-zone" style="
        display:none; position:fixed; left:22px; bottom:22px;
        width:130px; height:130px; border-radius:50%;
        background:rgba(11,28,34,0.55); border:2px solid rgba(42,111,133,0.9);
        touch-action:none; z-index:9999; user-select:none;">
      <div id="joy-knob" style="
        position:absolute; left:50%; top:50%; width:56px; height:56px;
        margin-left:-28px; margin-top:-28px; border-radius:50%;
        background:rgba(127,233,255,0.85); pointer-events:none;"></div>
    </div>
    <div id="joy-hint" style="
        display:none; position:fixed; left:22px; bottom:158px;
        color:#9fc3cd; font:12px/1.3 sans-serif; z-index:9999;
        text-shadow:0 1px 3px #000;">drag to walk</div>
